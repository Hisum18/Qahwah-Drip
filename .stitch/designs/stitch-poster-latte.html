<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Qahwah Drip - Iced Yemeni Latte Poster</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&amp;family=Nunito+Sans:wght@300;400;600;700&amp;family=Montserrat:wght@400;500;600;700&amp;family=Public+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        'qahwah-red': '#C4202C',
                        'brass-gold': '#B8924A',
                        'highland-green': '#2E6B43',
                        'marble-cream': '#F6F1E8',
                        'pure-linen': '#FBF8F2',
                        'walnut': '#5A3E29',
                        'camel-tan': '#B98A5E',
                        'espresso-ink': '#2A211B'
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Playfair Display", "serif"],
                        "display": ["Playfair Display", "serif"],
                        "body": ["Nunito Sans", "sans-serif"],
                        "label": ["Montserrat", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        .mihrab-arch {
            clip-path: path('M 0 100 Q 0 0 50 0 Q 100 0 100 100 L 100 1000 L 0 1000 Z');
            /* Approximate mihrab shape for modern browsers */
            border-top-left-radius: 50% 15%;
            border-top-right-radius: 50% 15%;
        }
    </style>
</head>
<body class="bg-marble-cream text-espresso-ink font-body min-h-screen flex flex-col items-center justify-center py-8">
<!-- Main Poster Container -->
<main class="w-full max-w-sm md:max-w-md bg-pure-linen shadow-2xl overflow-hidden flex flex-col relative aspect-[9/16] border border-brass-gold/20">
<!-- Subtle Pattern Background -->
<div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: radial-gradient(circle at 2px 2px, #B8924A 1px, transparent 0); background-size: 24px 24px;"></div>
<!-- Header -->
<header class="pt-8 pb-4 px-6 text-center z-10 relative">
<h1 class="font-headline text-qahwah-red text-2xl font-bold tracking-wider uppercase">Qahwah Drip</h1>
<div class="w-12 h-px bg-brass-gold mx-auto mt-3"></div>
</header>
<!-- Centerpiece Image with Mihrab Arch -->
<div class="flex-grow px-6 flex flex-col items-center justify-center relative z-10 mt-2">
<div class="relative w-full aspect-[3/4] p-1 border border-brass-gold/30 mihrab-arch bg-marble-cream shadow-sm">
<div class="w-full h-full overflow-hidden mihrab-arch relative">
<img class="object-cover w-full h-full hover:scale-105 transition-transform duration-700 ease-in-out" data-alt="A tall glass of iced yemeni latte filled with ice and topped with a light foam and cardamom dusting, resting on a white marble cafe table. Natural sunlight streaming from a nearby window creates soft shadows. The setting is a modern premium coffee shop with warm brass accents." src="https://lh3.googleusercontent.com/aida/AP1WRLtGYuFCXMwkJvLrQKo-akq-QXGj4BPyvRVsHU17bY0bYFsR4DTZr2UdU0m3E5jRUTAgRmZfljZgESFrnuj1uO4lpjyYZqr7Fy2dPI3x8UB6QrSn6iipUDF2icighMK9LX76M5F3U6YFqCAq9GPyNfIG-kkOHDyPMFKeUlxXGZOE9Cy8vkQ75U0cMrLkng6SRd4SM80L7N3OqTgCaUt20TpYbxSyRkBu91Ia45VUSN9thcnNJbWFThx1bkk"/>
<!-- Subtle inner shadow overlay -->
<div class="absolute inset-0 shadow-[inset_0_0_20px_rgba(0,0,0,0.1)] pointer-events-none"></div>
</div>
</div>
<!-- Price Badge -->
<div class="absolute top-1/2 right-4 -translate-y-1/2 bg-qahwah-red text-marble-cream font-label font-bold text-lg px-4 py-2 rounded-full shadow-lg border border-marble-cream/20 transform rotate-[-5deg]">
                $5.75
            </div>
</div>
<!-- Typography & Content -->
<div class="px-8 pb-8 pt-6 text-center z-10 relative bg-gradient-to-t from-pure-linen via-pure-linen to-transparent">
<h2 class="font-headline text-4xl font-bold text-espresso-ink mb-3 leading-tight drop-shadow-sm">Iced Yemeni Latte</h2>
<p class="font-label text-xs uppercase tracking-widest text-walnut mb-6 font-medium">Espresso, milk &amp; a whisper of cardamom — over ice</p>
<div class="flex items-center justify-center space-x-2 text-brass-gold mb-4">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
<div class="w-8 h-px bg-brass-gold/50"></div>
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
<!-- Footer -->
<footer class="bg-walnut text-pure-linen py-5 px-6 text-center mt-auto relative z-10 border-t border-brass-gold/30 flex flex-col items-center justify-center gap-2">
<p class="font-label text-xs uppercase tracking-widest text-pure-linen/90">Order at the counter · Falls Church, VA</p>
<span class="font-headline text-2xl text-qahwah-red font-bold mt-1 drop-shadow-md">قهوة</span>
</footer>
</main>
</body></html>
