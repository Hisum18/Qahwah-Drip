# Netlify configuration for Qahwah Drip
# Used when the site is connected to this git repo (continuous deploy).
# For drag-and-drop or CLI --dir deploys, the publish folder's _headers file applies.

[build]
  publish = "site/public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
